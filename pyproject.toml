[project]
name = "digitalcorpora-app"
version = "0.1.0"
description = "Digital Corpora Flask Application"
authors = [
    {name = "Simson Garfinkel",email = "simsong@acm.org"}
]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "flask>=3.1.1,<4.0.0",
    "boto3>=1.34.0",
    "botocore>=1.34.0",
    "filetype>=1.2.0",
    "mistune>=3.0.0",
    "mysql-connector-python>=8.0.0",
    "pymysql (>=1.1.1,<2.0.0)"
]

[project.optional-dependencies]
test = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0",
    "webtest>=3.0.0",
    "pylint>=3.0.0"
]

[tool.poetry]
packages = [{include = "digitalcorpora_app", from = "src"}]

[tool.poetry.dependencies]
python = "^3.13"
flask = "^3.1.1"
boto3 = "^1.34.0"
botocore = "^1.34.0"
filetype = "^1.2.0"
mistune = "^3.0.0"
mysql-connector-python = "^8.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.0.0"
pytest-cov = "^4.0.0"
webtest = "^3.0.0"
pylint = "^3.0.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
