AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31
Description: DigitalCorpora App - SAM Template for Testing

Globals:
  Function:
    Timeout: 30
    Runtime: python3.13
    MemorySize: 512
    Environment:
      Variables:
        PYTHONPATH: /var/task/src
        TEMPLATE_DIR: /var/task/src/digitalcorpora_app/templates
        STATIC_DIR: /var/task/src/digitalcorpora_app/static
        LOG_LEVEL: INFO

Resources:
  DigitalCorporaFunction:
    Type: AWS::Serverless::Function
    Properties:
      CodeUri: .
      Handler: lambda_handler.lambda_handler
      Metadata:
        BuildMethod: python3.13
        BuildProperties:
          UseRequirements: false
      Events:
        ApiEvent:
          Type: Api
          Properties:
            Path: /{proxy+}
            Method: ANY
        RootEvent:
          Type: Api
          Properties:
            Path: /
            Method: ANY
      Policies:
        - S3ReadPolicy:
            BucketName: digitalcorpora
        - Statement:
            - Effect: Allow
              Action:
                - logs:CreateLogGroup
                - logs:CreateLogStream
                - logs:PutLogEvents
              Resource: '*'
        - Statement:
            - Effect: Allow
              Action:
                - secretsmanager:GetSecretValue
                - secretsmanager:DescribeSecret
              Resource: !Sub "arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:digitalcorpora-*"

Outputs:
  DigitalCorporaApi:
    Description: "API Gateway endpoint URL for the DigitalCorpora function"
    Value: !Sub "https://${ServerlessRestApi}.execute-api.${AWS::Region}.amazonaws.com/Prod/"

  DigitalCorporaFunction:
    Description: "DigitalCorpora Lambda Function ARN"
    Value: !GetAtt DigitalCorporaFunction.Arn

  DigitalCorporaFunctionRole:
    Description: "Implicit IAM Role created for DigitalCorpora function"
    Value: !GetAtt DigitalCorporaFunctionRole.Arn